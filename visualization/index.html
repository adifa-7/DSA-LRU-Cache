<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LRU Cache Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>LRU Cache Visualizer</h1>
  <p>Understand cache hits, misses, and evictions visually</p>
</header>

<main>

  <section class="panel">
    <h3>Configure Cache</h3>
    <div class="controls">
      <input type="number" id="capacityInput" placeholder="Capacity">
      <button class="primary" onclick="setCapacity()">Set</button>
    </div>
  </section>

  <section class="panel">
    <h3>Cache Operations</h3>
    <div class="controls">
      <input type="number" id="keyInput" placeholder="Key">
      <input type="number" id="valueInput" placeholder="Value">
      <button onclick="put()">PUT</button>
      <button onclick="get()">GET</button>
    </div>
  </section>

  <section class="panel">
    <h3>Cache State <span>(MRU → LRU)</span></h3>
    <div id="cacheContainer"></div>
  </section>

</main>

<div id="toast"></div>

<script src="script.js"></script>
</body>
</html>
